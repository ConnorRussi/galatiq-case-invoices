[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "galatiq-invoice-system"
version = "0.1.0"
description = "Evidence-preserving invoice ingestion pipeline"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
ingestion = [
  "defusedxml>=0.7,<1",
  "openai>=1.0,<2",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
]
ingestion-dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]
validation = [
  "langgraph>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"invoice_system.ingestion" = ["config.toml", "evals/*.json"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
pythonpath = ["src"]
markers = [
  "live: opt-in calls to live Gemini",
]
