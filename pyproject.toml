[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "galatiq-invoice-system"
version = "0.1.0"
description = "Evidence-preserving invoice ingestion pipeline"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
ingestion = [
  "fpdf2>=2.8,<3",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "langsmith>=0.4,<1",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
]
ingestion-dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_system.ingestion = ["*.md"]
invoice_system.approval = ["*.md"]
